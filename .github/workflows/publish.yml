name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e #v10.3.2
      with:
        enable-cache: true

    - name: Set up Python
      run: uv python install 3.13

    - name: Verify tag matches package version
      run: |
        TAG="${GITHUB_REF_NAME#v}"
        PKG=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
        if [ "$TAG" != "$PKG" ]; then
          echo "Tag $GITHUB_REF_NAME does not match package version $PKG"
          exit 1
        fi

    - name: Install dependencies
      run: uv sync --extra dev --extra publish --python 3.13

    - name: Run unit tests
      run: uv run pytest

    - name: Build package
      run: uv run python -m build

    - name: Verify package
      run: uv run python -m twine check dist/*

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
      with:
        name: dist
        path: dist

    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 #v1.14.3

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 #v8.0.2
      with:
        name: dist
        path: dist

    - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 #v3.0.3
      with:
        files: dist/*
